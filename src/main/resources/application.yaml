server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: depcheck
  datasource:
    # 文件库：./data/depcheck.mv.db（相对启动目录，务必 gitignore）
    url: jdbc:h2:file:./data/depcheck;MODE=MySQL;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.company.depcheck: DEBUG

depcheck:
  upload:
    # 解压目录：./data/work/{uuid}/，相对启动目录
    root: ./data/work
    # 解压后总字节上限（2GB），超了按 ZIP 炸弹处理
    max-uncompressed-bytes: 2147483648
    # 解压后文件数上限
    max-file-count: 50000

  scan:
    # NVD 库目录（必须是已经建好的那套，见 01 手册）
    data-dir: D:/dc/data
    # 报告输出根目录，下面按 taskNo 分目录
    report-root: ./data/reports
    # 可选：有 Key 时填，没有就留空（不影响 datafeed 建好的库）
    nvd-api-key: ""
    # 内嵌模式下绝不允许自动更新（否则一次扫描等几小时）
    auto-update: false
    # 任务超时阈值（分钟）：看门狗每 60 秒检查一次，超时置 FAILED + code=3002
    # 验收时可临时改 0（立刻超时）；负数表示关闭看门狗
    timeout-minutes: 30
    # 扫描线程池：4GB 内存约束下"受理 8、并行 2"（依据见 04-7）
    # 注意 core 才是实际并行度：ThreadPoolExecutor 先占满 core，再排队，最后才扩到 max
    pool:
      core: 2
      max: 2
      queue: 8
    # 官方 CLI 路径：仅一致性自检（/api/dev/parity）使用
    cli-path: D:/dc/dependency-check/bin/dependency-check.bat

  # 数据保留：报告与解压目录都是可再生的中间产物，按天清（见 06 §3.3）
  retention:
    # 失败任务的报告目录保留时长（分钟）：留现场排障，但要有上限
    failed-report-minutes: 1440
    # 成功任务的报告目录保留天数（报告可重扫再生）
    success-report-days: 7
    # 项目保留天数（到期后连解压目录、任务、明细一起清）；<=0 表示不自动清理
    project-days: 30
    # 清理任务执行时间；验收时可临时改成 "0 * * * * ?"（每分钟）
    purge-cron: "0 30 2 * * ?"
  # 登录（计划 5.9：一期固定账号；上线前务必改掉默认密码）
  auth:
    username: depcheck
    password: Depcheck@2026
    # token 有效期（小时）
    token-ttl-hours: 12